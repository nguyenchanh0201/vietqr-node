name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx vitest run
      # Builds, packs, installs the exact tarball into clean consumers with network blocked.
      - name: Pack smoke test
        run: node test/smoke/run.mjs
        env:
          SMOKE_PACK_DIR: ${{ runner.temp }}/pack
      # The one tarball that is published: packed and smoke-tested in this designated job.
      - name: Checksum tested tarball
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        working-directory: ${{ runner.temp }}/pack
        run: sha256sum *.tgz > SHA256SUMS && cat SHA256SUMS
      - name: Upload tested tarball
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-tarball
          path: ${{ runner.temp }}/pack/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x' # >= 22.14.0 required for trusted publishing
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-tarball
          path: pack
      - name: Verify checksum and version
        working-directory: pack
        run: |
          sha256sum -c SHA256SUMS
          tarball=$(ls *.tgz)
          version=$(tar -xOzf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tarball version $version does not match tag $GITHUB_REF_NAME"; exit 1; }
          echo "TARBALL=$PWD/$tarball" >> "$GITHUB_ENV"
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles an older npm. No token exists.
      - name: Upgrade npm for trusted publishing
        run: npm install -g --ignore-scripts npm@11.21.1
      - name: Publish the tested tarball
        run: npm publish "$TARBALL" --access public
